<title>Виртуалды физика зертханасы</title>
<style>
:root{--bg:#f2f7ff;--card:#fff;--tx:#14213d;--pr:#3b6cf6;--pu:#8b5cf6;--lb:#7dd3fc;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1530;--card:#1b2347;--tx:#e8eeff}}
:root[data-theme=dark]{--bg:#0f1530;--card:#1b2347;--tx:#e8eeff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(90deg,var(--pr),var(--pu));color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{flex:1;cursor:pointer}
button,.btn{font:inherit;border:0;border-radius:12px;padding:9px 16px;background:linear-gradient(135deg,var(--pr),var(--pu));color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #3b6cf655}
header button{background:#ffffff33;padding:6px 12px}
main{max-width:980px;margin:auto;padding:14px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.hero{position:relative;overflow:hidden;text-align:center;padding:36px 12px;border-radius:24px;background:linear-gradient(135deg,#dbeafe,#ede9fe 60%,#e0f2fe);color:#14213d}
.hero h1{margin:0 0 6px;font-size:clamp(26px,6vw,46px)}
.fl{position:absolute;font-size:28px;opacity:.55;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(20deg)}}
.orb{display:inline-block;animation:sp 6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 18px #0001;transition:transform .25s}
.card:hover{transform:translateY(-5px) rotate(-.4deg)}
.big{text-align:center}.big .e{font-size:54px}
h2,h3{color:var(--pr)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #8884;padding:5px;text-align:center}
input[type=number]{width:80px;padding:6px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--tx)}
textarea{width:100%;min-height:120px;border-radius:12px;padding:10px;background:var(--bg);color:var(--tx);border:1px solid #8886;font:inherit}
.tw{overflow-x:auto}
.opt{display:block;width:100%;text-align:left;margin:5px 0;background:var(--bg);color:var(--tx);border:1px solid #8886}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
canvas{max-width:100%;background:var(--card);border-radius:12px}
.f{font-family:Georgia,serif;font-style:italic;background:#8b5cf622;padding:2px 8px;border-radius:8px}
.back{margin-bottom:10px}
.po{display:none}@media print{.po{display:block}header,.back,.np{display:none!important}body{background:#fff;color:#000}}
.hero h1,.hero p{position:relative;z-index:1}</style></head><body>

function topicIndex(){let h=`<button class="back" onclick="location.hash=''">← Артқа</button><h2>📚 7–11-сынып: физика тақырыптары</h2><p>Тақырыпты таңдаңыз. Теория, формула, өлшем бірлігі, шағын тәжірибе және өзіндік тексеру бар.</p><input id="topicSearch" aria-label="Тақырып іздеу" placeholder="🔎 Тақырыпты іздеу..." style="width:100%;padding:13px;border-radius:12px;border:1px solid #aaa"><div id="topicCards" class="grid"></div>`;m.innerHTML=h;const render=()=>{const q=topicSearch.value.toLocaleLowerCase('kk');topicCards.innerHTML=Object.entries(TOPICS).flatMap(([c,ts])=>ts.map((t,i)=>({c,t,i}))).filter(x=>(x.c+' '+x.t[0]+' '+x.t[1]).toLocaleLowerCase('kk').includes(q)).map(x=>`<div class="card"><small>${x.c}-сынып</small><h3>${x.t[0]}</h3><p>${x.t[1]}</p><button onclick="location.hash='topic_${x.c}_${x.i}'">Оқу →</button></div>`).join('')||'<p>Тақырып табылмады.</p>'};topicSearch.oninput=render;render()}
